# Archived 2026-11-08: the Kindle now uses Open-Meteo directly.
# The original Meteoblue workflow is frozen at main commit
# 6881767fa7633e0d758b822951e1cc06796c1e8e and in the local full-version backup.
# No schedule, secrets or provider requests remain in this workflow.
name: Kindle Meteoblue (archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Meteoblue fetching is disabled
        run: echo 'Meteoblue automatic fetching is disabled. Kindle uses Open-Meteo.'
